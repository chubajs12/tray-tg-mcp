name: release

# Build "TG MCP.exe" on every v* tag and attach it (with its SHA256) to a GitHub Release.
# No secrets are used: nothing is embedded into the executable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: Smoke test (environment diagnostics, no network)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TG MCP.exe" -ArgumentList '--diag', 'diag.json' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "diag failed: $($p.ExitCode)" }
          Get-Content diag.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-mcp-exe
          path: |
            dist/TG MCP.exe
            dist/TG MCP.exe.sha256

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TG MCP.exe
            dist/TG MCP.exe.sha256
          generate_release_notes: true
