name: release

# Build the exe on every v* tag and attach it (as TG-MCP.exe) with its SHA256 to a GitHub Release.
# No secrets are used: nothing is embedded into the executable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Tests
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: Smoke test (environment diagnostics, no network)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TG MCP.exe" -ArgumentList '--diag', 'diag.json' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "diag failed: $($p.ExitCode)" }
          Get-Content diag.json

      - name: Prepare release assets (TG-MCP.exe + sha256sum-compatible checksum)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\TG MCP.exe" "out\TG-MCP.exe"
          $h = (Get-FileHash -Algorithm SHA256 "out\TG-MCP.exe").Hash.ToLower()
          # "<hash>  <name>" + LF, no BOM: works with `sha256sum -c` and is easy to compare with Get-FileHash
          [IO.File]::WriteAllText("out\TG-MCP.exe.sha256", "$h  TG-MCP.exe`n", (New-Object Text.UTF8Encoding $false))
          Get-Content "out\TG-MCP.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tg-mcp-exe
          path: |
            out/TG-MCP.exe
            out/TG-MCP.exe.sha256

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/TG-MCP.exe
            out/TG-MCP.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
